networks:
  minecraft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  geyser:
    image: portiz93/geysermc-proxy:latest
    pull_policy: daily
    networks:
      minecraft-network:
        ipv4_address: 172.28.0.4
    restart: unless-stopped
    environment:
      JAVA_ADDRESS: lazymc
      JAVA_PORT: 25565
      JAVA_AUTH_TYPE: floodgate
    ports:
      - "19132:19132/udp"
    volumes:
      - geyser-data:/Geyser/data
      - ./minecraft-data/plugins/floodgate/key.pem:/Geyser/floodgate/key.pem:ro

  lazymc:
    image: ghcr.io/joesturge/lazymc-docker-proxy:latest
    pull_policy: daily
    networks:
      minecraft-network:
        ipv4_address: 172.28.0.2
    restart: unless-stopped
    volumes:
      - ./minecraft-data:/server:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "25565:25565"

  mc:
    image: itzg/minecraft-server
    pull_policy: daily
    mem_limit: 2g
    networks:
      minecraft-network:
        ipv4_address: 172.28.0.3
    labels:
      - lazymc.enabled=true
      - lazymc.group=mc
      - lazymc.server.address=mc:25565
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      MEMORY: 2G
      MODRINTH_PROJECTS: |
        fabric-api
        floodgate
      OPS: BoilingFuncat3
    tty: true
    restart: "no"
    stdin_open: true
    volumes:
      - ./minecraft-data:/data

volumes:
  data:
  geyser-data:
